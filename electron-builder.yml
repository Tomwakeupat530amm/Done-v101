appId: com.atomicrecovery.app
productName: Atomic Recovery
copyright: Copyright © 2026 Atomic Recovery

directories:
  buildResources: build
  output: dist

files:
  - '**/*'
  - 'node_modules/.prisma/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!prisma/migrations'
  - '!docs'

extraResources:
  - from: 'prisma/prod.db'
    to: 'prod.db'
  - from: node_modules/.prisma/
    to: node_modules/.prisma/
    filter:
      - '**/*'
  - from: node_modules/@prisma/client/
    to: node_modules/@prisma/client/
    filter:
      - '**/*'
  - from: 'prisma/migrations'
    to: 'migrations'
    filter:
      - '**/*'

asarUnpack:
  - resources/**

win:
  executableName: atomic-recovery
  icon: build/icon.png
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
  notarize: false
  icon: build/icon.png
dmg:
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
    - deb
  maintainer: atomicrecovery.app
  category: Healthcare
appImage:
  artifactName: ${productName}-${version}.${ext}

npmRebuild: true
publish:
  provider: generic
  url: https://example.com/auto-updates
